variables:
  AUTH_STRATEGY:
    value: "STATIC_BASELINE"
    options:
      - "STATIC_BASELINE"
      - "FEDERATED_OIDC"
      - "VAULT_STATIC_KV"
      - "VAULT_DYNAMIC_STS"
      - "VAULT_APPROLE"
      - "VAULT_OIDC"
    description: "Authentication strategy selection for current benchmark run"
  SCENARIO:
    value: "baseline"
    options:
      - "baseline"
      - "high_freq"
      - "thundering_herd"
      - "real_world"
    description: "Benchmark test scenario"
  TEST_RUN_ID:
    value: "manual_run"
    description: "Unique test run identifier generated by orchestrator"
  CONCURRENCY_LEVEL:
    value: "1"
    description: "Number of concurrent tasks (1 for baseline/high_freq, 10/25/50 for thundering_herd)"
  ITERATIONS:
    value: "1"
    description: "Number of loop repetitions inside worker job"

stages:
  - execute-benchmarks

# =====================================================================
# TRIGGER STRATEGY SUB-PIPELINES
# =====================================================================
run-static-baseline:
  stage: execute-benchmarks
  rules:
    - if: '$AUTH_STRATEGY == "STATIC_BASELINE"'
  trigger:
    include: pipelines/auth-static.yml
    strategy: depend
    forward:
      yaml_variables: true
      pipeline_variables: true

run-federated-oidc:
  stage: execute-benchmarks
  rules:
    - if: '$AUTH_STRATEGY == "FEDERATED_OIDC"'
  trigger:
    include: pipelines/auth-oidc.yml
    strategy: depend
    forward:
      yaml_variables: true
      pipeline_variables: true

run-vault-kv:
  stage: execute-benchmarks
  rules:
    - if: '$AUTH_STRATEGY == "VAULT_STATIC_KV" || $AUTH_STRATEGY == "VAULT_KV" || $AUTH_STRATEGY == "VAULT_APPROLE"'
  trigger:
    include: pipelines/auth-vault-kv.yml
    strategy: depend
    forward:
      yaml_variables: true
      pipeline_variables: true

run-vault-dynamic:
  stage: execute-benchmarks
  rules:
    - if: '$AUTH_STRATEGY == "VAULT_DYNAMIC_STS" || $AUTH_STRATEGY == "VAULT_DYNAMIC" || $AUTH_STRATEGY == "VAULT_OIDC"'
  trigger:
    include: pipelines/auth-vault-oidc.yml
    strategy: depend
    forward:
      yaml_variables: true
      pipeline_variables: true
