# =====================================================================
# STRATEGY 1: STATIC SECRETS (Baseline & Scenarios)
# Shell Executor - Runs directly as native processes inside the runner
# =====================================================================

.static-base:
  variables:
    PYTHONUNBUFFERED: "1"
  before_script:
    - 'echo "[Shell Runner] Host: $(hostname) | CPU Cores: $(nproc)"'
    - 'if [ -f /opt/benchmarks/bench_static.py ]; then export BENCH_DIR="/opt/benchmarks"; else export BENCH_DIR="benchmarks"; fi'

# ---------------------------------------------------------------------
# 1. Baseline Scenario (N=1, Concurrency=1)
# ---------------------------------------------------------------------
static-baseline:
  extends: .static-base
  rules:
    - if: '$SCENARIO == "baseline" || $SCENARIO == null || $SCENARIO == ""'
  script:
    - 'python3 "$BENCH_DIR/bench_static.py" --test-run-id "${TEST_RUN_ID:-manual_run}" --scenario "baseline" --concurrency 1 --iterations ${ITERATIONS:-1} --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID"'

# ---------------------------------------------------------------------
# 2. Credential Lifecycle Scenario (Phase 1 Init -> Delay -> Phase 2 Renewal/Reuse)
# ---------------------------------------------------------------------
static-lifecycle:
  extends: .static-base
  rules:
    - if: '$SCENARIO == "credential_lifecycle" || $SCENARIO == "lifecycle" || $SCENARIO == "high_freq"'
  script:
    - 'python3 "$BENCH_DIR/bench_static.py" --test-run-id "${TEST_RUN_ID:-manual_run}" --scenario "${SCENARIO:-credential_lifecycle}" --concurrency 1 --iterations ${ITERATIONS:-2} --lifecycle-delay ${LIFECYCLE_DELAY:-5} --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID"'

# ---------------------------------------------------------------------
# 3. Thundering Herd Scenario (Concurrency 10 / 25 / 50)
# ---------------------------------------------------------------------
static-thundering-herd-10:
  extends: .static-base
  rules:
    - if: '$SCENARIO == "thundering_herd" && $CONCURRENCY_LEVEL == "10"'
  parallel: 10
  script:
    - 'python3 "$BENCH_DIR/bench_static.py" --test-run-id "${TEST_RUN_ID:-manual_run}" --scenario "thundering_herd" --concurrency 10 --iterations 1 --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID"'

static-thundering-herd-25:
  extends: .static-base
  rules:
    - if: '$SCENARIO == "thundering_herd" && $CONCURRENCY_LEVEL == "25"'
  parallel: 25
  script:
    - 'python3 "$BENCH_DIR/bench_static.py" --test-run-id "${TEST_RUN_ID:-manual_run}" --scenario "thundering_herd" --concurrency 25 --iterations 1 --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID"'

static-thundering-herd-50:
  extends: .static-base
  rules:
    - if: '$SCENARIO == "thundering_herd" && $CONCURRENCY_LEVEL == "50"'
  parallel: 50
  script:
    - 'python3 "$BENCH_DIR/bench_static.py" --test-run-id "${TEST_RUN_ID:-manual_run}" --scenario "thundering_herd" --concurrency 50 --iterations 1 --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID"'
