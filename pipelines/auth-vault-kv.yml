# =====================================================================
# STRATEGY 3: HASHICORP VAULT STATIC KV (GitLab JWT Login + KV v2 Read)
# Shell Executor - Runs directly as native processes inside the runner
# =====================================================================

.vault-kv-base:
  id_tokens:
    VAULT_OIDC_TOKEN:
      aud: http://vault:8200
  variables:
    PYTHONUNBUFFERED: "1"
  before_script:
    - 'echo "[Shell Runner] Host: $(hostname) | CPU Cores: $(nproc)"'
    - 'if [ -f /opt/benchmarks/bench_vault_kv.py ]; then export BENCH_DIR="/opt/benchmarks"; else export BENCH_DIR="benchmarks"; fi'

# ---------------------------------------------------------------------
# 1. Baseline Scenario (N=1, Concurrency=1)
# ---------------------------------------------------------------------
vault-kv-baseline:
  extends: .vault-kv-base
  rules:
    - if: '$SCENARIO == "baseline" || $SCENARIO == null || $SCENARIO == ""'
  script:
    - 'python3 "$BENCH_DIR/bench_vault_kv.py" --strategy "${AUTH_STRATEGY:-VAULT_STATIC_KV}" --test-run-id "${TEST_RUN_ID:-manual_run}" --scenario "baseline" --concurrency 1 --iterations ${ITERATIONS:-1} --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID"'

# ---------------------------------------------------------------------
# 2. Credential Lifecycle Scenario (Phase 1 Init -> Delay -> Phase 2 Renewal/Reuse)
# ---------------------------------------------------------------------
vault-kv-lifecycle:
  extends: .vault-kv-base
  rules:
    - if: '$SCENARIO == "credential_lifecycle" || $SCENARIO == "lifecycle" || $SCENARIO == "high_freq"'
  script:
    - 'python3 "$BENCH_DIR/bench_vault_kv.py" --strategy "${AUTH_STRATEGY:-VAULT_STATIC_KV}" --test-run-id "${TEST_RUN_ID:-manual_run}" --scenario "${SCENARIO:-credential_lifecycle}" --concurrency 1 --iterations ${ITERATIONS:-2} --lifecycle-delay ${LIFECYCLE_DELAY:-5} --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID"'

# ---------------------------------------------------------------------
# 3. Thundering Herd Scenario (Concurrency 5 / 10 / 20 / 25 / 40 / 50)
# ---------------------------------------------------------------------
vault-kv-thundering-herd-5:
  extends: .vault-kv-base
  rules:
    - if: '$SCENARIO == "thundering_herd" && $CONCURRENCY_LEVEL == "5"'
  parallel: 5
  script:
    - 'python3 "$BENCH_DIR/bench_vault_kv.py" --strategy "${AUTH_STRATEGY:-VAULT_STATIC_KV}" --test-run-id "${TEST_RUN_ID:-manual_run}" --scenario "thundering_herd" --concurrency 5 --iterations 1 --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID"'

